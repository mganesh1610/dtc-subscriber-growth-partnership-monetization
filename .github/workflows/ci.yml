name: DTC Subscriber Growth & Partnership CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SHA-256 Verified Subscriber & Partnership Pipeline
        run: python3 src/pipeline.py
      - name: Run Unit & SQL Reconciliation Tests
        run: python3 -m unittest discover -s tests -v
